<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>基因组数据访问治理</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; }
    main { max-width: 820px; margin: auto; }
    pre { background: #f3f4f6; padding: 1rem; border-radius: 8px; overflow-x: auto; }
    button { padding: .5rem .8rem; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #d1d5db; padding: .4rem .6rem; text-align: left; font-size: .9rem; }
    input { padding: .4rem; margin: .2rem .2rem .2rem 0; }
    label { font-size: .85rem; }
  </style>
</head>
<body>
<main>
  <h1>基因组数据访问治理</h1>
  <p>这是最小演示页面。使用浏览器或 curl 调用 JSON API。</p>
  <p><button onclick="checkHealth()">检查服务状态</button></p>
  <pre id="result">等待操作</pre>
  <h2>取用台账</h2>
  <p><button onclick="loadGrants()">刷新凭证余量与累计用量</button></p>
  <div id="grants"></div>
  <h3>提交取用登记</h3>
  <p>
    <label>凭证ID <input id="wGrant" size="36"></label>
    <label>取用单号 <input id="wOrder" size="14"></label>
    <label>数量 <input id="wQty" type="number" min="1" value="1" style="width:5rem"></label>
    <label>用途 <input id="wPurpose" size="20"></label>
    <button onclick="submitWithdrawal()">提交取用</button>
  </p>
  <pre id="withdrawResult">尚未提交</pre>
  <h2>常用接口</h2>
  <pre>GET  /health
GET  /api/&lt;kind&gt;
POST /api/&lt;kind&gt;
GET  /api/entities/&lt;id&gt;
POST /api/entities/&lt;id&gt;/actions

POST /api/withdrawals  取用登记：{"grant_id","order_no","quantity","purpose"}</pre>
</main>
<script>
async function checkHealth() {
  const response = await fetch('/health');
  document.getElementById('result').textContent = JSON.stringify(await response.json(), null, 2);
}

async function loadGrants() {
  const response = await fetch('/api/grants');
  const payload = await response.json();
  const rows = (payload.items || []).map(g => {
    const d = g.data || {};
    return `<tr><td>${g.id}</td><td>${g.status}</td><td>${d.quota_total ?? 0}</td>`
      + `<td>${d.used_total ?? 0}</td><td>${d.remaining_quota ?? 0}</td></tr>`;
  }).join('');
  document.getElementById('grants').innerHTML =
    '<table><tr><th>凭证</th><th>状态</th><th>可取用总量</th>'
    + '<th>累计用量</th><th>剩余余量</th></tr>' + rows + '</table>';
}

async function submitWithdrawal() {
  const body = {
    grant_id: document.getElementById('wGrant').value.trim(),
    order_no: document.getElementById('wOrder').value.trim(),
    quantity: Number(document.getElementById('wQty').value),
    purpose: document.getElementById('wPurpose').value.trim()
  };
  const response = await fetch('/api/withdrawals', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-User-Id': 'researcher-1',
      'X-Role': 'applicant'
    },
    body: JSON.stringify(body)
  });
  const text = JSON.stringify(await response.json(), null, 2);
  document.getElementById('withdrawResult').textContent = text;
  if (response.ok) {
    document.getElementById('wGrant').value = body.grant_id;
    loadGrants();
  }
}
</script>
</body>
</html>
